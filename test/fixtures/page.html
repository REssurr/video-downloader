<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>本地验收页 · 视频下载器</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #101014; color: #e7e7ea; margin: 32px; }
      video { width: 480px; background: #000; border-radius: 8px; }
      code { background: #1c1c22; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>本地验收页</h1>
    <p>这个页面只做一件事：让「视频下载器」的扩展看到一个正在播放的视频。</p>
    <video id="player" controls autoplay muted loop src="./sample.mp4"></video>
    <p>媒体直链：<code>http://127.0.0.1:5399/sample.mp4</code></p>
    <p>用法：在 Chrome/Edge 里打开本页 → 窗口里点「抓当前页」应列出 1 行；或把上面的直链粘进窗口直接下载。</p>
  </body>
</html>
